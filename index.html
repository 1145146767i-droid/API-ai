<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API-AI · GPT + DeepSeek + Claude + Qwen</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans SC",sans-serif;background:#f4f6f8;color:#18202a}.app{max-width:900px;height:100vh;height:100dvh;margin:auto;background:white;display:flex;flex-direction:column}header{padding:17px 18px;border-bottom:1px solid #e7e9ed}h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#737c87;font-size:13px}.bar{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:8px;padding:12px 16px;border-bottom:1px solid #eee}.bar select,.bar button,input{padding:10px 12px;border:1px solid #d8dde4;border-radius:10px;font-size:14px}.bar select{min-width:0}.bar button{background:#1769e0;color:white;border:0}.chat{flex:1;overflow:auto;padding:18px}.msg{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#f1f3f5;white-space:pre-wrap;line-height:1.6}.msg.user{background:#1769e0;color:#fff;margin-left:15%}.meta{font-size:11px;color:#8a929c;margin-bottom:4px}.msg.user .meta{color:#dce9ff}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.composer input{flex:1}.composer button{padding:10px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:600}@media(max-width:650px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.chat{padding:12px}.msg.user{margin-left:5%}}</style></head><body><main class="app"><header><h1>🤖 API-AI</h1><p>家族 → 模型：统一调用 GPT / DeepSeek / Claude / Qwen API</p></header><div class="bar"><select id="family"></select><select id="model"></select><input id="custom" placeholder="自定义模型 ID（可选）"><button id="refresh">刷新</button></div><section id="chat" class="chat"><div class="msg">选择 AI 家族，再选择该家族的模型，然后开始聊天。</div></section><form id="form" class="composer"><input id="input" placeholder="输入消息..." autocomplete="off"><button>发送</button></form></main><script>
const family=document.querySelector("#family"),model=document.querySelector("#model"),custom=document.querySelector("#custom"),chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#input"),refresh=document.querySelector("#refresh");let catalog={},messages=[];
function add(role,text,meta=""){const d=document.createElement("div");d.className="msg "+role;if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;d.append(m)}d.append(document.createTextNode(text));chat.append(d);chat.scrollTop=chat.scrollHeight}
function fillModels(){const p=catalog[family.value];model.innerHTML="";(p?.models||[]).forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name+" · "+x.type;model.append(o)});if(p&&!p.configured)refresh.textContent="未配置 Key";else refresh.textContent="已配置"}
function fillFamilies(){family.innerHTML="";Object.entries(catalog).forEach(([id,p])=>{const o=document.createElement("option");o.value=id;o.textContent=p.name;family.append(o)});fillModels()}
async function load(){try{const r=await fetch("/api/catalog");catalog=await r.json();fillFamilies()}catch(e){refresh.textContent="连接失败"}}
family.onchange=fillModels;refresh.onclick=load;
form.onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;const m=custom.value.trim()||model.value;add("user",q);messages.push({role:"user",content:q});input.value="";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:family.value,model:m,messages})});const d=await r.json();if(!r.ok)throw new Error(d.error);add("assistant",d.content,d.provider+" · "+d.model);messages.push({role:"assistant",content:d.content})}catch(err){add("assistant","❌ "+err.message)}input.focus()};
load();
</script></body></html>
