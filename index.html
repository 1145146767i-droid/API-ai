<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API-AI · 多模型聚合平台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans SC",sans-serif;background:#f4f6f8;color:#18202a}.app{max-width:980px;height:100vh;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column}
header{padding:16px 18px;border-bottom:1px solid #e7e9ed}h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#737c87;font-size:13px}
.bar{display:grid;grid-template-columns:1fr 1fr 1.4fr auto auto;gap:8px;padding:11px 16px;border-bottom:1px solid #eee}.bar select,.bar button,.bar input{padding:10px 12px;border:1px solid #d8dde4;border-radius:10px;font-size:14px}.bar button{background:#1769e0;color:#fff;border:0}.tools{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid #eee;align-items:center;flex-wrap:wrap}.tools button,.tools label{padding:7px 10px;border:1px solid #d8dde4;border-radius:9px;background:#fff;font-size:13px;cursor:pointer}.tools .on{background:#e8f1ff;border-color:#1769e0;color:#1769e0}.file-list{display:flex;gap:6px;flex-wrap:wrap}.file{background:#f1f3f5;padding:5px 8px;border-radius:8px;font-size:12px}.chat{flex:1;overflow:auto;padding:18px}.msg{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#f1f3f5;line-height:1.65;overflow-wrap:anywhere}.msg.user{background:#1769e0;color:#fff;margin-left:15%}.meta{font-size:11px;color:#8a929c;margin-bottom:5px}.msg.user .meta{color:#dce9ff}.md p{margin:0 0 9px}.md p:last-child{margin-bottom:0}.md pre{background:#17191d;color:#f4f4f4;padding:12px;border-radius:10px;overflow:auto;position:relative}.md code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.codebox{position:relative}.copy{position:absolute;right:7px;top:7px;padding:5px 8px;border:0;border-radius:7px;background:#fff;color:#222;cursor:pointer}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.composer textarea{flex:1;resize:none;min-height:44px;max-height:150px;padding:11px 12px;border:1px solid #d8dde4;border-radius:10px;font:inherit}.composer button{padding:10px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:600}@media(max-width:700px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.chat{padding:12px}.msg.user{margin-left:5%}}
</style></head><body><main class="app"><header><h1>🤖 API-AI</h1><p>统一聚合 GPT / DeepSeek / Claude / Qwen / Gemini / GLM / 豆包 / Grok / Meta / Microsoft / Kimi / MiniMax / 混元 / 文心 / MiMo / 阶跃星辰</p></header>
<div class="bar"><select id="family"></select><select id="model"></select><input id="custom" placeholder="自定义模型 ID（可选）"><select id="searchMode" title="联网搜索模式"><option value="auto">联网：自动</option><option value="always">联网：始终开</option><option value="off">联网：关闭</option></select><button id="refresh">刷新</button></div>
<div class="tools"><label for="files">📎 上传文件</label><input id="files" type="file" multiple hidden><button id="clearFiles">清空文件</button><span id="fileList" class="file-list"></span></div>
<section id="chat" class="chat"><div class="msg">选择模型开始聊天。支持上传文本/代码类文件；模型输出的 Markdown 代码块会自动渲染。</div></section>
<form id="form" class="composer"><textarea id="input" placeholder="输入消息..."></textarea><button>发送</button></form></main>
<script>
const family=document.querySelector("#family"),model=document.querySelector("#model"),custom=document.querySelector("#custom"),searchMode=document.querySelector("#searchMode"),chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#input"),refresh=document.querySelector("#refresh"),filesEl=document.querySelector("#files"),fileList=document.querySelector("#fileList"),clearFiles=document.querySelector("#clearFiles");let catalog={},messages=[],files=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMarkdown(s){let x=esc(s),parts=x.split(/(```[a-zA-Z0-9_+-]*\n[\s\S]*?```)/g);return parts.map(p=>{if(p.startsWith("```")){const z=p.match(/^```([^\n]*)\n([\s\S]*?)```$/);if(!z)return "<p>"+p+"</p>";return '<div class="codebox"><button class="copy" onclick="copyCode(this)">复制</button><pre><code class="language-'+(z[1]||"text")+'">'+z[2]+'</code></pre></div>'}return p.split(/\n\n+/).map(v=>"<p>"+v.replace(/\n/g,"<br>")+"</p>").join("")}).join("")}
window.copyCode=async b=>{const code=b.parentElement.querySelector("code").innerText;await navigator.clipboard.writeText(code);b.textContent="已复制";setTimeout(()=>b.textContent="复制",1200)};
function add(role,text,meta=""){const d=document.createElement("div");d.className="msg "+role;if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;d.append(m)}const body=document.createElement("div");body.className="md";body.innerHTML=role==="assistant"?renderMarkdown(text):esc(text).replace(/\n/g,"<br>");d.append(body);chat.append(d);chat.scrollTop=chat.scrollHeight}
function fillModels(){const p=catalog[family.value];model.innerHTML="";(p?.models||[]).forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name+" · "+x.type;model.append(o)});refresh.textContent=p&&!p.configured?"未配置 Key":"已配置"}
function fillFamilies(){family.innerHTML="";Object.entries(catalog).forEach(([id,p])=>{const o=document.createElement("option");o.value=id;o.textContent=p.name;family.append(o)});fillModels()}
async function load(){try{const r=await fetch("/api/catalog");catalog=await r.json();fillFamilies()}catch(e){refresh.textContent="连接失败"}}
async function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type||"text/plain",text:String(r.result)});r.onerror=reject;r.readAsText(file)})}
filesEl.onchange=async()=>{for(const f of filesEl.files){if(f.size>5*1024*1024)continue;files.push(await readFile(f))}renderFiles();filesEl.value=""};
function renderFiles(){fileList.innerHTML=files.map((f,i)=>'<span class="file">'+esc(f.name)+' <button onclick="removeFile('+i+')" style="border:0;background:none;cursor:pointer">×</button></span>').join("")}
window.removeFile=i=>{files.splice(i,1);renderFiles()};clearFiles.onclick=()=>{files=[];renderFiles()};family.onchange=fillModels;refresh.onclick=load;
form.onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;const m=custom.value.trim()||model.value;add("user",q,files.length?"📎 "+files.map(f=>f.name).join(", "):"");messages.push({role:"user",content:q});input.value="";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:family.value,model:m,messages,searchMode:searchMode.value,files})});const d=await r.json();if(!r.ok)throw new Error(d.error);add("assistant",d.content,(d.provider||"")+" · "+(d.model||"")+(d.webSearch?" · 🔎 已搜索":""));messages.push({role:"assistant",content:d.content});files=[];renderFiles()}catch(err){add("assistant","❌ "+err.message)}input.focus()};
load();
</script></body></html>
