<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API-AI · GPT + DeepSeek</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans SC",sans-serif;background:#f4f6f8;color:#18202a}.app{max-width:850px;height:100vh;height:100dvh;margin:auto;background:white;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #e7e9ed}h1{margin:0;font-size:22px}p{margin:5px 0 0;color:#737c87;font-size:13px}.bar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid #eee}.bar select,.bar button,input{padding:10px 12px;border:1px solid #d8dde4;border-radius:10px;font-size:14px}.bar select{flex:1}.bar button{background:#1769e0;color:white;border:0}.chat{flex:1;overflow:auto;padding:18px}.msg{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#f1f3f5;white-space:pre-wrap;line-height:1.6}.msg.user{background:#1769e0;color:#fff;margin-left:15%}.meta{font-size:11px;color:#8a929c;margin-bottom:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.composer input{flex:1}.composer button{padding:10px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:600}</style></head><body><main class="app"><header><h1>🤖 API-AI</h1><p>统一调用 GPT / DeepSeek API</p></header><div class="bar"><select id="provider"><option value="openai">GPT</option><option value="deepseek">DeepSeek</option></select><input id="model" placeholder="模型（可选）"><button id="refresh">检测 API</button></div><section id="chat" class="chat"><div class="msg">选择 GPT 或 DeepSeek 后开始聊天。</div></section><form id="form" class="composer"><input id="input" placeholder="输入消息..." autocomplete="off"><button>发送</button></form></main><script>
const chat=document.querySelector("#chat"),form=document.querySelector("#form"),input=document.querySelector("#input"),provider=document.querySelector("#provider"),model=document.querySelector("#model"),refresh=document.querySelector("#refresh");let messages=[];
function add(role,text,meta=""){const d=document.createElement("div");d.className="msg "+role;d.innerHTML=meta?'<div class="meta">'+meta+'</div>':'';d.append(document.createTextNode(text));chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function status(){try{const r=await fetch("/api/models");const d=await r.json();const p=d.providers.find(x=>x.id===provider.value);refresh.textContent=p?.configured?"API 已配置":"未配置 Key"}catch(e){refresh.textContent="连接失败"}}
provider.onchange=status;refresh.onclick=status;status();
form.onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add("user",q);messages.push({role:"user",content:q});input.value="";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:provider.value,model:model.value.trim()||undefined,messages})});const d=await r.json();if(!r.ok)throw new Error(d.error);add("assistant",d.content,d.provider+" · "+d.model);messages.push({role:"assistant",content:d.content})}catch(err){add("assistant","❌ "+err.message) }input.focus()};
</script></body></html>
